<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>票券（已加密）· 家族東京9日遊</title>
    <meta name="description" content="旅程票券（需密碼）">

    <link rel="prefetch" href="index.html">
    <link rel="prefetch" href="luggage.html">

    <!-- 加到手機主畫面（PWA） -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#6366f1">
    <link rel="icon" href="icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="東京9日">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
        rel="stylesheet">

    <!-- 與行程頁共用的樣式（設計 token、標頭、底部導覽、深色模式） -->
    <link rel="stylesheet" href="shared.css">

    <style>
        /* ========== Header（本頁專屬：票券圖示動畫）========== */
        .header-title .icon-ticket {
            display: inline-block;
            animation: tilt 3.2s ease-in-out infinite;
        }

        @keyframes tilt {

            0%,
            100% {
                transform: translateY(0) rotate(-4deg);
            }

            50% {
                transform: translateY(-4px) rotate(4deg);
            }
        }

        main {
            padding: 18px 16px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        /* ========== 票卡 ==========
           QR 一定要白底高對比，讀取機才掃得到，所以這張卡不跟著深色模式變。 */
        .ticket-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 22px;
            padding: 18px 18px 16px;
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.22), 0 2px 8px rgba(0, 0, 0, 0.06);
            animation: slideUp 0.45s ease-out both;
        }

        .tk-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .tk-badge {
            font-size: 0.72rem;
            font-weight: 700;
            color: #fff;
            padding: 4px 11px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .tk-seq {
            margin-left: auto;
            font-family: var(--font-display);
            font-size: 0.78rem;
            font-weight: 700;
            color: #94a3b8;
            font-variant-numeric: tabular-nums;
        }

        .qr-wrap {
            position: relative;
            display: flex;
            justify-content: center;
        }

        /* QR 原圖是 145px 點陣圖，用 pixelated 放大才不會被平滑成糊的 */
        .qr {
            width: min(70vw, 46vh, 340px);
            height: min(70vw, 46vh, 340px);
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .used-veil {
            position: absolute;
            inset: -6px;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #16a34a;
            border-radius: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 4px;
            color: #16a34a;
            font-weight: 800;
        }

        .used-veil span {
            font-size: 2.2rem;
            line-height: 1;
        }

        .is-used .used-veil {
            display: flex;
        }

        .tk-foot {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed #e2e8f0;
            text-align: center;
        }

        .tk-code {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #1e293b;
        }

        .tk-sub {
            font-size: 0.76rem;
            color: #64748b;
            line-height: 1.7;
            margin-top: 3px;
        }

        /* ========== 控制列 ========== */
        .controls {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            max-width: 420px;
        }

        .ctl {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--gray-700);
            border-radius: 14px;
            padding: 14px 0;
            cursor: pointer;
            transition: transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .ctl:active {
            transform: scale(0.96);
        }

        .ctl.arrow {
            flex: 0 0 62px;
            font-size: 1.25rem;
            line-height: 1;
        }

        .ctl.use {
            flex: 1;
        }

        .ctl.use.on {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            border-color: transparent;
            color: #fff;
        }

        /* ========== 圓點 ========== */
        .dots {
            display: flex;
            justify-content: center;
            gap: 7px;
            flex-wrap: wrap;
            max-width: 420px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--gray-300);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .dot.on {
            background: var(--primary-500);
            transform: scale(1.35);
        }

        .dot.used {
            background: #16a34a;
        }

        .hint {
            font-size: 0.74rem;
            color: var(--gray-500);
            line-height: 1.7;
            text-align: center;
            max-width: 420px;
            padding-bottom: 8px;
        }

        /* ========== NEX 換票卡 ========== */
        .nex {
            display: none;
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            box-shadow: var(--glass-shadow);
            padding: 18px;
            animation: slideUp 0.45s ease-out both;
        }

        .nex.show {
            display: block;
        }

        .nex h2 {
            font-size: 1rem;
            color: var(--gray-800);
        }

        .nex .warn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.28);
            color: #dc2626;
            border-radius: 12px;
            padding: 12px 13px;
            font-size: 0.8rem;
            line-height: 1.75;
            margin: 10px 0 14px;
        }

        body.dark .nex .warn {
            color: #fca5a5;
        }

        .nex .big-code {
            text-align: center;
            background: linear-gradient(135deg, var(--primary-500), var(--accent-violet));
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 14px;
            color: #fff;
        }

        .nex .big-code span {
            display: block;
            font-size: 0.7rem;
            opacity: 0.85;
            letter-spacing: 1px;
        }

        .nex .big-code b {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 2.1rem;
            letter-spacing: 4px;
        }

        .nex table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .nex th,
        .nex td {
            border-bottom: 1px solid var(--glass-border);
            padding: 8px 6px;
            text-align: left;
            color: var(--gray-700);
        }

        .nex th {
            font-size: 0.7rem;
            color: var(--gray-500);
            font-weight: 700;
        }

        .nex td.no {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.72rem;
            color: var(--gray-600);
        }

        .nex .route {
            margin-top: 12px;
            font-size: 0.76rem;
            color: var(--gray-500);
            line-height: 1.7;
            text-align: center;
        }

        .hide {
            display: none !important;
        }
    </style>
</head>

    <style>
        /* z-index 要低於 header 與 nav(100)：加到主畫面後沒有瀏覽器返回鍵，
           解鎖畫面若蓋住導覽，忘記密碼的人就只能強制關掉 app */

            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 24px calc(120px + env(safe-area-inset-bottom, 0px));

        body.dark #lock {
            background: linear-gradient(180deg, #0f172a 0%, #1e1b2e 45%, #0c1a2b 100%);
        }

        #lock .box {
            width: 100%;
            max-width: 340px;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            box-shadow: var(--glass-shadow);
            padding: 30px 22px 24px;
            animation: slideUp 0.5s ease-out both;

        #lock .ico {
            font-size: 2.4rem;
            line-height: 1;
        }

        #lock h1 {
            font-size: 1.05rem;
            color: var(--gray-800);
            margin: 12px 0 6px;
        }

        #lock p.tip {
            font-size: 0.8rem;
            color: var(--gray-500);
            line-height: 1.7;
            margin-bottom: 18px;
        }

        #lock input {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--gray-800);
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            text-align: center;
        }

        body.dark #lock input {
            background: rgba(255, 255, 255, 0.06);
        }

        #lock button {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            color: #fff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary-500), var(--accent-violet) 60%, var(--accent-pink));
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        }

        #lock button:active {
            transform: scale(0.97);
        }

        #lock button:disabled {
            opacity: 0.6;
        }

        #lock .err {
            font-size: 0.8rem;
            color: #dc2626;
            margin-top: 12px;
            min-height: 1.2em;
        }
    </style>
    <div id="lock">

            <button onclick="unlock()" id="unlock-btn">解鎖</button>

    <script>
        // 在首次繪製前套用主題，避免換頁時閃一下白底
        try {
            var _s = JSON.parse(localStorage.getItem('tokyo-trip-state-v1')) || {};
            var _dark = typeof _s.dark === 'boolean' ? _s.dark
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (_dark) document.body.classList.add('dark');
        } catch (e) { /* localStorage 不可用就照原本流程 */ }
    </script>

    <header class="app-header">

        </button>
        <h1 class="header-title"><span class="icon-ticket">&#127915;</span> 票券</h1>
        <p class="header-subtitle">晴空塔入場券 · NEX 成田特快</p>

    <script>
        let TICKETS = [], NEX = [], NEXINFO = {};
        const KEY = 'tokyo-tickets-used-v1';

        let used = new Set();
        try { used = new Set(JSON.parse(localStorage.getItem(KEY)) || []); } catch (e) { }
        const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...used])); } catch (e) { } };

        // 最後一頁是 NEX 換票資訊（沒有 QR，要換票）
        // total 依賴票券資料，放到 boot() 才算：加密版載入時還沒解密
        let total = 1, idx = 0;

        // 跨頁的導覽鍵：按下當下先把膠囊滑過去，換頁需要時間，不能讓使用者以為沒按到
        function navPress(btn, pos) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const pill = document.getElementById('nav-pill');
            if (pill) pill.className = 'nav-pill' + (pos > 1 ? ' p' + pos : '');
        }

        function show(i) {
            idx = (i + total) % total;
            const isNex = idx === TICKETS.length;

            document.getElementById('nex').classList.toggle('show', isNex);
            document.getElementById('ticket-card').classList.toggle('hide', isNex);
            document.getElementById('use-btn').classList.toggle('hide', isNex);

            if (!isNex) {
                const t = TICKETS[idx];
                document.getElementById('qr').src = 'data:image/png;base64,' + t.qr;
                const badge = document.getElementById('tk-badge');
                badge.textContent = t.kind;
                badge.style.background = t.color;
                document.getElementById('tk-seq').textContent = (idx + 1) + ' / ' + total;
                document.getElementById('tk-code').textContent = t.code;
                document.getElementById('tk-sub').innerHTML =
                    t.label + ' · ' + t.price + '<br>2026-08-18 17:30&#8211;18:00 入場 · 晴空塔 4 樓';

                const on = used.has(t.id);
                document.getElementById('qr-wrap').classList.toggle('is-used', on);
                const btn = document.getElementById('use-btn');
                btn.classList.toggle('on', on);
                btn.textContent = on ? '\u2713 已使用（點一下取消）' : '標記為已使用';
            }

            document.querySelectorAll('.dot').forEach((d, i2) => {
                d.classList.toggle('on', i2 === idx);
                d.classList.toggle('used', i2 < TICKETS.length && used.has(TICKETS[i2].id));
            });
        }

        const go = (step) => show(idx + step);

        function toggleUsed() {
            const t = TICKETS[idx];
            if (!t) return;
            used.has(t.id) ? used.delete(t.id) : used.add(t.id);
            save();
            show(idx);
        }

        // ===== 深色／淺色（與其他頁共用同一個設定）=====
        const SUN_ICON = '<circle cx="12" cy="12" r="5"></circle>' +
            '<line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>' +
            '<line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line>' +
            '<line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>' +
            '<line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line>';
        const MOON_ICON = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>';

        function applyTheme(dark) {
            document.body.classList.toggle('dark', dark);
            const ic = document.getElementById('theme-icon');
            if (ic) ic.innerHTML = dark ? MOON_ICON : SUN_ICON;
        }

        function toggleTheme() {
            const dark = !document.body.classList.contains('dark');
            applyTheme(dark);
            try {
                const s = JSON.parse(localStorage.getItem('tokyo-trip-state-v1')) || {};
                s.dark = dark;
                localStorage.setItem('tokyo-trip-state-v1', JSON.stringify(s));
            } catch (e) { }
        }

        function updateTripStatus() {
            const el = document.getElementById('trip-status');
            if (!el) return;
            const today = new Date();
            const d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const skytree = new Date(2026, 7, 18);
            const days = Math.round((skytree - d) / 86400000);
            el.textContent = days > 0 ? '晴空塔入場還有 ' + days + ' 天'
                : days === 0 ? '今天就是晴空塔入場日' : '晴空塔 8/18 · NEX 8/25';
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') go(-1);
            if (e.key === 'ArrowRight') go(1);
        });

        let x0 = null;
        document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
        document.addEventListener('touchend', e => {
            if (x0 === null) return;
            const dx = e.changedTouches[0].clientX - x0;
            if (Math.abs(dx) > 45) go(dx < 0 ? 1 : -1);
            x0 = null;
        }, { passive: true });

        // 所有依賴票券資料的初始化都集中在這裡。
        // 明文版直接跑；加密版把最後那行 boot() 拿掉，改成解密成功後才呼叫。
        function boot() {
            total = TICKETS.length + 1;

            // 受取コード與班次由 JS 注入，不寫死在 HTML 裡（加密版才不會漏明文）
            document.getElementById('nex-code').textContent = NEXINFO.code;
            document.getElementById('nex-info').textContent =
                NEXINFO.route + ' · ' + NEXINFO.train + ' · ' + NEXINFO.car + ' · 每張 ' + NEXINFO.price;

            document.getElementById('nex-rows').innerHTML =
                NEX.map(r => '<tr><td><b>' + r.seat + '</b></td><td class="no">' + r.no + '</td></tr>').join('');

            document.getElementById('dots').innerHTML =
                Array.from({ length: total }, (_, i) => '<div class="dot" onclick="show(' + i + ')"></div>').join('');

            show(0);
        }

        applyTheme(document.body.classList.contains('dark'));
        updateTripStatus();


        // 手機按返回鍵常會從 bfcache 還原頁面，DOM 狀態被保留，
        // 導覽膠囊會停在離開前按下的那一格，跟實際所在頁面對不上
        window.addEventListener('pageshow', e => {
            if (!e.persisted) return;
            document.querySelectorAll('.nav-btn').forEach(b =>
                b.classList.toggle('active', b.hasAttribute('aria-current')));
            document.getElementById('nav-pill').className = 'nav-pill p4';
        });

        const b64d = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

        async function unlock() {
            const btn = document.getElementById('unlock-btn');
            const msg = document.getElementById('lock-msg');
            const pw = document.getElementById('pw').value;
            if (!pw) { msg.textContent = '請輸入密碼'; return; }

            btn.disabled = true; btn.textContent = '解密中…'; msg.textContent = '';
            try {
                const enc = new TextEncoder();
                const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
                const key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: b64d(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
                    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
                const plain = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: b64d(PAYLOAD.iv) }, key, b64d(PAYLOAD.data));
                const data = JSON.parse(new TextDecoder().decode(plain));

                TICKETS = data.tickets; NEX = data.nex; NEXINFO = data.nexinfo;
                document.getElementById('lock').remove();
                boot();
            } catch (e) {
                msg.textContent = '密碼錯誤';
                btn.disabled = false; btn.textContent = '解鎖';
            }
        }

        document.getElementById('pw').addEventListener('keydown',
            e => { if (e.key === 'Enter') unlock(); });
    </script>
